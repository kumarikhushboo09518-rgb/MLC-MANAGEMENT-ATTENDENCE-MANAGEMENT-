name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and Accept Licenses
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Restore or Generate Debug Keystore + Print SHA-1
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Restored permanent debug.keystore from GitHub Secret."
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "=========================================="
            echo "SAVE THIS BASE64 IN GITHUB SECRET NAMED DEBUG_KEYSTORE_B64:"
            base64 -w 0 debug.keystore
            echo ""
            echo "=========================================="
          fi
          echo "=========================================="
          echo "FINAL SHA-1 FINGERPRINT:"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:"
          echo "=========================================="

      - name: Use Real google-services.json
        env:
          GOOGLE_SERVICES_JSON_TEXT: ${{ secrets.GOOGLE_SERVICES_JSON_TEXT }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_TEXT" ]; then
            printf "%s\n" "$GOOGLE_SERVICES_JSON_TEXT" > app/google-services.json
            echo "Created app/google-services.json from GitHub Secret."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json nahi mili!"
            exit 1
          fi
          echo "Using real app/google-services.json file."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4096m"

      - name: Collect Built APKs
        run: |
          mkdir -p built-apks
          find . -path "*/outputs/apk/debug/*.apk" -exec cp {} built-apks/ \;
          ls -la built-apks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: built-apks/*.apk
          
