name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and Accept Licenses
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Create and Save Permanent Debug Keystore + Print SHA-1
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add permanent debug.keystore"
            git push
          fi
          echo "=========================================="
          echo "COPY THIS SHA-1 AND ADD TO FIREBASE:"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:"
          echo "=========================================="

      - name: Verify Real google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json missing! Upload real file to app/ folder."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "REAL FAILURE REASON:"
            grep -n -C 5 -E "What went wrong:|Caused by:|Execution failed for task|e: file:|No matching client found" build.log | tail -n 45
            echo "=========================================="
            exit $EXIT_CODE
          fi
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4096m"

      - name: Collect Built APKs
        run: |
          mkdir -p built-apks
          find . -path "*/outputs/apk/debug/*.apk" -exec cp {} built-apks/ \;
          ls -la built-apks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: built-apks/*.apk
          
