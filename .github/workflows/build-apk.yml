name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and Accept Licenses
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Restore or Generate Release Keystore + Print SHA-1
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS="${RELEASE_STORE_PASSWORD:-android123}"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-mlcreleasekey}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-android123}"

          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
            echo "Restored release.keystore from GitHub Secret."
          else
            keytool -genkeypair -v -keystore release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MLC Management,O=MLC,C=IN"
            echo "=========================================="
            echo "SAVE THIS BASE64 IN GITHUB SECRET NAMED RELEASE_KEYSTORE_B64:"
            base64 -w 0 release.keystore
            echo ""
            echo "Store Pass: $STORE_PASS | Alias: $KEY_ALIAS | Key Pass: $KEY_PASS"
            echo "=========================================="
          fi

          echo "=========================================="
          echo "RELEASE SHA-1 FINGERPRINT:"
          keytool -list -v -keystore release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" | grep -i "SHA1:"
          echo "=========================================="

      - name: Configure Gradle Release Signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASS="${RELEASE_STORE_PASSWORD:-android123}"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-mlcreleasekey}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-android123}"
          KEYSTORE_PATH="$(pwd)/release.keystore"

          if [ -f app/build.gradle.kts ]; then
            cat <<EOF >> app/build.gradle.kts

android {
    signingConfigs {
        create("release") {
            storeFile = file("$KEYSTORE_PATH")
            storePassword = "$STORE_PASS"
            keyAlias = "$KEY_ALIAS"
            keyPassword = "$KEY_PASS"
        }
    }
    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")
            isMinifyEnabled = false
        }
    }
}
EOF
          elif [ -f app/build.gradle ]; then
            cat <<EOF >> app/build.gradle

android {
    signingConfigs {
        release {
            storeFile file("$KEYSTORE_PATH")
            storePassword "$STORE_PASS"
            keyAlias "$KEY_ALIAS"
            keyPassword "$KEY_PASS"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
EOF
          fi

      - name: Use Real google-services.json
        env:
          GOOGLE_SERVICES_JSON_TEXT: ${{ secrets.GOOGLE_SERVICES_JSON_TEXT }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_TEXT" ]; then
            printf "%s\n" "$GOOGLE_SERVICES_JSON_TEXT" > app/google-services.json
            echo "Created app/google-services.json from GitHub Secret."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json nahi mili!"
            exit 1
          fi
          echo "Using real app/google-services.json file."

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --console=plain
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4096m"

      - name: Collect Built Release APKs
        run: |
          mkdir -p built-apks
          find . -path "*/outputs/apk/release/*.apk" -exec cp {} built-apks/ \;
          ls -la built-apks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: built-apks/*.apk
          
